apiVersion: v1
kind: ConfigMap
metadata:
  name: cosmic-council-config
  namespace: cosmic-council
data:
  ai_provider: "mock"
  database_pool_size: "10"
  database_timeout: "30.0"
  log_level: "INFO"
  enable_caching: "true"
  cache_ttl_seconds: "3600"
  max_concurrent_requests: "10"
  rate_limit_rpm: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: cosmic-council-secrets
  namespace: cosmic-council
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  openai_api_key: ""  # echo -n "your-key" | base64
  anthropic_api_key: ""  # echo -n "your-key" | base64
  jwt_secret_key: ""  # echo -n "your-secret" | base64
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cosmic-council-data
  namespace: cosmic-council
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
