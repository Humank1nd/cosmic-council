apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmic-council-api
  namespace: cosmic-council
  labels:
    app: cosmic-council-api
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cosmic-council-api
  template:
    metadata:
      labels:
        app: cosmic-council-api
        component: api
    spec:
      containers:
      - name: api
        image: cosmic-council:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://cosmic_council:$(DATABASE_PASSWORD)@postgres-service:5432/cosmic_council"
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cosmic-council-secrets
              key: DATABASE_PASSWORD
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: cosmic-council-secrets
              key: SECRET_KEY
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: cosmic-council-secrets
              key: API_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: cosmic-council-secrets
              key: OPENAI_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: cosmic-council-secrets
              key: ANTHROPIC_API_KEY
        # Perpetual Thinking System Configuration
        - name: PERPETUAL_DATABASE_URL
          value: "postgresql://cosmic_council:$(DATABASE_PASSWORD)@postgres-perpetual-service:5432/cosmic_council_perpetual"
        - name: PERPETUAL_AI_ENABLED
          value: "true"
        - name: PERPETUAL_AI_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: cosmic-council-config
              key: PERPETUAL_AI_PROVIDER
        - name: PERPETUAL_AI_MODEL
          valueFrom:
            configMapKeyRef:
              name: cosmic-council-config
              key: PERPETUAL_AI_MODEL
        - name: PERPETUAL_AI_TEMPERATURE
          valueFrom:
            configMapKeyRef:
              name: cosmic-council-config
              key: PERPETUAL_AI_TEMPERATURE
        - name: PERPETUAL_AI_MAX_TOKENS
          valueFrom:
            configMapKeyRef:
              name: cosmic-council-config
              key: PERPETUAL_AI_MAX_TOKENS
        - name: PERPETUAL_MAX_CONCURRENT_SESSIONS
          valueFrom:
            configMapKeyRef:
              name: cosmic-council-config
              key: PERPETUAL_MAX_CONCURRENT_SESSIONS
        - name: PERPETUAL_SESSION_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: cosmic-council-config
              key: PERPETUAL_SESSION_TIMEOUT
        - name: PERPETUAL_LEARNING_ENABLED
          valueFrom:
            configMapKeyRef:
              name: cosmic-council-config
              key: PERPETUAL_LEARNING_ENABLED
        - name: PERPETUAL_ADAPTATION_ENABLED
          valueFrom:
            configMapKeyRef:
              name: cosmic-council-config
              key: PERPETUAL_ADAPTATION_ENABLED
        - name: PERPETUAL_BREAKTHROUGH_DETECTION
          valueFrom:
            configMapKeyRef:
              name: cosmic-council-config
              key: PERPETUAL_BREAKTHROUGH_DETECTION
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: cosmic-council-secrets
              key: JWT_SECRET
        - name: JWT_ALGORITHM
          valueFrom:
            secretKeyRef:
              name: cosmic-council-secrets
              key: JWT_ALGORITHM
        - name: JWT_EXPIRATION
          valueFrom:
            secretKeyRef:
              name: cosmic-council-secrets
              key: JWT_EXPIRATION
        envFrom:
        - configMapRef:
            name: cosmic-council-config
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: uploads
          mountPath: /app/uploads
        - name: backups
          mountPath: /app/backups
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: logs
        emptyDir: {}
      - name: uploads
        emptyDir: {}
      - name: backups
        emptyDir: {}
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: cosmic-council-api-service
  namespace: cosmic-council
  labels:
    app: cosmic-council-api
    component: api
spec:
  selector:
    app: cosmic-council-api
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cosmic-council-api-hpa
  namespace: cosmic-council
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cosmic-council-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Max

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cosmic-council-api-pdb
  namespace: cosmic-council
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cosmic-council-api
