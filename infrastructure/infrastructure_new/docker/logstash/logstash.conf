input {
  beats {
    port => 5044
  }
  
  tcp {
    port => 5000
    codec => json_lines
  }
  
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [fields][service] == "cosmic-council-api" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{WORD:logger} - %{LOGLEVEL:level} - %{GREEDYDATA:message}" }
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    
    mutate {
      add_field => { "service_name" => "cosmic-council-api" }
      add_field => { "environment" => "%{[fields][environment]}" }
    }
  }
  
  if [fields][service] == "cosmic-council-web" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{WORD:logger} - %{LOGLEVEL:level} - %{GREEDYDATA:message}" }
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    
    mutate {
      add_field => { "service_name" => "cosmic-council-web" }
      add_field => { "environment" => "%{[fields][environment]}" }
    }
  }
  
  if [fields][service] == "postgres" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{INT:pid}\] %{LOGLEVEL:level}: %{GREEDYDATA:message}" }
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    
    mutate {
      add_field => { "service_name" => "postgres" }
      add_field => { "environment" => "%{[fields][environment]}" }
    }
  }
  
  if [fields][service] == "redis" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{INT:pid}:%{WORD:role} %{GREEDYDATA:message}" }
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
    }
    
    mutate {
      add_field => { "service_name" => "redis" }
      add_field => { "environment" => "%{[fields][environment]}" }
    }
  }
  
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # Add common fields
  mutate {
    add_field => { "cluster" => "cosmic-council" }
    add_field => { "version" => "1.0.0" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "cosmic-council-logs-%{+YYYY.MM.dd}"
    template_name => "cosmic-council-logs"
    template => "/usr/share/logstash/templates/cosmic-council-logs.json"
    template_overwrite => true
  }
  
  # Debug output (remove in production)
  stdout {
    codec => rubydebug
  }
}
