global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Cosmic Council API (Development)
  - job_name: 'cosmic-council-api-dev'
    static_configs:
      - targets: ['api-dev:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Cosmic Council Web (Development)
  - job_name: 'cosmic-council-web-dev'
    static_configs:
      - targets: ['web-dev:8001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # PostgreSQL (Development)
  - job_name: 'postgres-dev'
    static_configs:
      - targets: ['postgres-dev:5432']
    scrape_interval: 30s

  # Redis (Development)
  - job_name: 'redis-dev'
    static_configs:
      - targets: ['redis-dev:6379']
    scrape_interval: 30s
