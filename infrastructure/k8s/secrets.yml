  # Service configuration
  LOG_LEVEL: "INFO"
  LOG_JSON: "false"
  
  # Gateway configuration
  GATEWAY_PORT: "8000"
  GATEWAY_HOST: "0.0.0.0"
  
  # Analytics configuration
  ANALYTICS_PORT: "8001"
  ANALYTICS_HOST: "0.0.0.0"
  
  # Reflection configuration
  REFLECTION_PORT: "8002"
  REFLECTION_HOST: "0.0.0.0"
