apiVersion: v1
kind: Secret
metadata:
  name: cc-secrets
  namespace: default
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  # To encode: echo -n "your_password" | base64
  db_password: Y29zbWljX2NvdW5jaWw=  # cosmic_council
  api_key: eW91cl9hcGlfa2V5  # your_api_key
  jwt_secret: eW91cl9qd3Rfc2VjcmV0  # your_jwt_secret
