apiVersion: apps/v1
kind: Deployment
metadata:
  name: reflection-deployment
  labels:
    app: reflection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reflection
  template:
    metadata:
      labels:
        app: reflection
    spec:
      containers:
        - name: reflection
          image: cosmic-council-reflection:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: dream_caesar
            - name: DB_USER
              value: dream_caesar
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cc-secrets
                  key: db_password
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: reflection-service
spec:
  selector:
    app: reflection
  ports:
    - protocol: TCP
      port: 8002
      targetPort: 8002
  type: ClusterIP
