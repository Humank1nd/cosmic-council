name: Codex Automation Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 2 * * 1" # Weekly automated improvements
  workflow_dispatch:
    inputs:
      codex_task:
        description: "Specific Codex task to run"
        required: false
        default: "improve code quality and add tests"
        type: string

env:
  CODEX_HOME: ~/.codex
  RUST_LOG: codex_core=info,codex_tui=info

jobs:
  codex-automated-improvements:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex login --api-key "${{ secrets.OPENAI_API_KEY }}"

      - name: Run Codex Automated Improvements
        run: |
          # Set up Codex configuration
          mkdir -p ~/.codex
          cat > ~/.codex/config.toml << EOF
          [default]
          approval_policy = "on-failure"
          sandbox = "workspace-write"
          model = "o1-preview"

          [mcp_servers.cosmic-council]
          command = "python"
          args = ["-m", "src.cosmic_council.mcp_server"]
          env = { "OPENAI_API_KEY" = "${{ secrets.OPENAI_API_KEY }}" }
          EOF

          # Run Codex with different tasks based on trigger
          if [ "${{ github.event_name }}" = "schedule" ]; then
            codex exec --full-auto "Review and improve code quality, add missing tests, update documentation, and optimize performance across the entire codebase"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            codex exec --full-auto "${{ github.event.inputs.codex_task }}"
          else
            # For PRs and pushes, focus on specific improvements
            codex exec --full-auto "Review the recent changes, improve code quality, add comprehensive tests, and ensure all functions have proper docstrings and type hints"
          fi

      - name: Generate Changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          codex exec --full-auto "Update CHANGELOG.md with the latest changes, following conventional commit format and including all significant features, fixes, and improvements"

      - name: Create Pull Request for Improvements
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🤖 Automated improvements via Codex"
          title: "🤖 Automated Code Quality Improvements"
          body: |
            ## Automated Improvements by Codex

            This PR contains automated improvements generated by Codex:

            - Code quality enhancements
            - Test coverage improvements
            - Documentation updates
            - Performance optimizations
            - Security improvements

            **Generated on:** ${{ github.run_number }}
            **Trigger:** ${{ github.event_name }}

            Please review the changes before merging.
          branch: codex-improvements-${{ github.run_number }}
          delete-branch: true

  codex-test-generation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex login --api-key "${{ secrets.OPENAI_API_KEY }}"

      - name: Generate Tests for Changed Files
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E '\.(py)$' | head -10)

          if [ -n "$CHANGED_FILES" ]; then
            echo "Changed files: $CHANGED_FILES"
            codex exec --full-auto "Generate comprehensive unit tests for the following changed Python files: $CHANGED_FILES. Ensure tests cover edge cases, error conditions, and follow the existing test patterns in the tests/ directory."
          else
            echo "No Python files changed, skipping test generation"
          fi

  codex-documentation:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Codex CLI
        run: |
          npm install -g @openai/codex
          codex login --api-key "${{ secrets.OPENAI_API_KEY }}"

      - name: Update Documentation
        run: |
          codex exec --full-auto "Update all documentation files in docs/ directory to reflect the latest code changes. Ensure API documentation is current, update README files, and improve code examples and usage instructions."

      - name: Commit Documentation Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📚 Update documentation via Codex"
          file_pattern: "docs/**"
